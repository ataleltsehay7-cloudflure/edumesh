{"name":"Build APK","on":{"push":{},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Unzip project","run":"mkdir -p work\nfor z in ./*.zip; do unzip -q -o \"$z\" -d work; done\nS=$(find work -name settings.gradle.kts | head -1)\necho \"PROJ=$(dirname \"$S\")\" >> \"$GITHUB_ENV\""},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Build debug APK","working-directory":"${{ env.PROJ }}","run":"gradle --no-daemon assembleDebug"},{"uses":"actions/upload-artifact@v4","with":{"name":"EduMesh-debug-apk","path":"${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk"}},{"uses":"softprops/action-gh-release@v2","with":{"tag_name":"latest-build","name":"EduMesh APK (latest)","files":"${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
